name: ANKA Sadece Tarama (EMIRSIZ)

# SADECE gorev_08_30_tarama() cagirir — gunluk_bomba.json'u taze uretir.
# Hicbir emir tetiklenmez, hicbir flag konmaz, hicbir sey calistirilmaz.
# Kullanici sonucu Mac'ten gorur, sonra (kendi karariyla) flag+restart
# yaparsa alim olur. Bu workflow alim YAPMAZ, alim icin VERI HAZIRLAR.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y sshpass
      - name: VPS'te tarama
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -uo pipefail
          HOST="78.135.87.29"; VUSER="Administrator"
          [ -z "${VPS_PASSWORD:-}" ] && { echo "::error::secret yok"; exit 1; }
          read -r -d '' PS <<'PSEOF' || true
          $ErrorActionPreference='Continue'
          Set-Location C:\ANKA
          $env:PYTHONUTF8='1'
          Write-Output '## Sabah taramasi (gorev_08_30_tarama) — EMIRSIZ'
          Write-Output '```'
          & 'C:\Program Files\Python312\python.exe' -X utf8 -c "import sys; sys.path.insert(0,r'C:\ANKA'); from otonom_trader import gorev_08_30_tarama; gorev_08_30_tarama(); print('OK')" 2>&1 | Select-Object -Last 20 | Out-String
          Write-Output '```'
          Write-Output ''
          Write-Output '## Tarama sonucu — gunluk_bomba.json'
          Write-Output '```'
          if (Test-Path data\gunluk_bomba.json) {
            $j = Get-Content data\gunluk_bomba.json -Raw | ConvertFrom-Json
            Write-Output ('Tarih: ' + $j.tarih)
            Write-Output ('Aday sayisi: ' + $j.bombalar.Count)
            $j.bombalar | Select-Object -First 15 | ForEach-Object { '  ' + $_.ticker + '  skor ' + $_.bomba_skor }
          } else { Write-Output 'gunluk_bomba.json yok!' }
          Write-Output '```'
          PSEOF
          ENC=$(printf '%s' "$PS" | iconv -t UTF-16LE | base64 -w0)
          mkdir -p data
          {
            echo "# 🔭 Sabah Tarama Sonucu (EMIRSIZ)"
            echo ""
            echo "_$(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M:%S TR')_"
            echo ""
            sshpass -p "$VPS_PASSWORD" ssh -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              "$VUSER@$HOST" "powershell -NoProfile -EncodedCommand $ENC" 2>&1 || echo "SSH HATA"
          } > data/sabah_tarama_sonuc.md
      - run: |
          git config user.name "anka-bot"; git config user.email "actions@github.com"
          git add data/sabah_tarama_sonuc.md
          git diff --staged --quiet || { git commit -m "Sabah tarama sonucu"; git push; }
