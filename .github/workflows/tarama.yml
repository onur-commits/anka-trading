name: ANKA Canli Tarama (emirsiz)

# otonom_trader.py --simdi calistirir: tarama + skor + rapor uretir,
# ALIM/SATIM EMRI VERMEZ (tek_dongu'da emir yok). Sonra gunluk_bomba.json
# adaylarini gosterir. "Bot ne alacakti" canli kaniti, para harcamadan.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y sshpass
      - name: VPS'te tarama calistir (emirsiz)
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -uo pipefail
          HOST="78.135.87.29"; VUSER="Administrator"
          [ -z "${VPS_PASSWORD:-}" ] && { echo "::error::VPS_PASSWORD yok"; exit 1; }
          read -r -d '' PS <<'PSEOF' || true
          $ErrorActionPreference='SilentlyContinue'
          Set-Location C:\ANKA
          $env:PYTHONUTF8='1'
          Write-Output '## Tarama calistiriliyor (otonom_trader.py --simdi, EMIRSIZ)...'
          Write-Output '```'
          & 'C:\Program Files\Python312\python.exe' -X utf8 otonom_trader.py --simdi 2>&1 | Select-Object -Last 30 | Out-String
          Write-Output '```'
          Write-Output ''
          Write-Output '## Bugunun aday hisseleri (gunluk_bomba.json) — bot bunlari >=25 ise ALIRDI'
          Write-Output '```'
          if (Test-Path data\gunluk_bomba.json) {
            $b = Get-Content data\gunluk_bomba.json -Raw | ConvertFrom-Json
            Write-Output ("Tarih: " + $b.tarih)
            $b.bombalar | Select-Object -First 15 | ForEach-Object { "  " + $_.ticker + " : skor " + $_.bomba_skor }
          } else { Write-Output '(gunluk_bomba.json olusmadi)' }
          Write-Output '```'
          PSEOF
          ENC=$(printf '%s' "$PS" | iconv -t UTF-16LE | base64 -w0)
          mkdir -p data
          {
            echo "# 🔭 ANKA Canli Tarama (emirsiz)"
            echo ""
            echo "_$(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M:%S TR')_"
            echo ""
            sshpass -p "$VPS_PASSWORD" ssh -o ConnectTimeout=20 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              "$VUSER@$HOST" "powershell -NoProfile -EncodedCommand $ENC" 2>&1 || echo "SSH hata"
          } > data/tarama_sonuc.md
      - name: commit
        run: |
          git config user.name "anka-bot"; git config user.email "actions@github.com"
          git add data/tarama_sonuc.md
          git diff --staged --quiet || { git commit -m "Tarama sonucu (emirsiz)"; git push; }
