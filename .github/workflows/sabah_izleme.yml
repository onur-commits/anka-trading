name: ANKA Sabah Izleme (EMIRSIZ)

# Sabah otonom izleme — 09:10 TR (06:10 UTC), hafta ici.
# Yapar (SALT-OKUMA + emirsiz tarama garantisi):
#   1. 08:30 tarama sonucu (gunluk_bomba.json) taze mi? Degilse gorev_08_30_tarama()
#      cagrilir (EMIRSIZ — sadece veri uretir, alim YAPMAZ).
#   2. Config dogrula: MIN_BOMBA_SKOR_ALIS == 15 + KARA_LISTE aktif mi.
#   3. 09:05 alim ani: bugun otonom_trades.json'da emir verildi mi.
#   4. Sonuc -> data/sabah_izleme.md (commit+push). durum.yml bunu DURUM.md'ye basar.
#
# HARD LIMIT: otonom_trader BASLATILMAZ, emir TETIKLENMEZ. Sadece okuma + emirsiz tarama.

on:
  schedule:
    - cron: '10 6 * * 1-5'   # UTC 06:10 = TR 09:10, hafta ici (09:05 alim sonrasi)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sabah_izleme:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y sshpass
      - name: VPS sabah izleme
        env:
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -uo pipefail
          HOST="78.135.87.29"; VUSER="Administrator"
          [ -z "${VPS_PASSWORD:-}" ] && { echo "::error::VPS_PASSWORD yok"; exit 1; }
          read -r -d '' PS <<'PSEOF' || true
          $ErrorActionPreference='Continue'
          Set-Location C:\ANKA; $env:PYTHONUTF8='1'
          $py = 'C:\Program Files\Python312\python.exe'
          $bugun = Get-Date -Format 'yyyy-MM-dd'

          Write-Output '### 1) 08:30 Tarama (gunluk_bomba.json)'
          $tazeTarama = $false
          if (Test-Path data\gunluk_bomba.json) {
            $j = Get-Content data\gunluk_bomba.json -Raw | ConvertFrom-Json
            if ($j.tarih -like ($bugun + '*')) { $tazeTarama = $true }
          }
          if (-not $tazeTarama) {
            Write-Output 'Tarama bugun calismamis -> gorev_08_30_tarama() (EMIRSIZ) calistiriliyor...'
            & $py -X utf8 -c "import sys; sys.path.insert(0,r'C:\ANKA'); from otonom_trader import gorev_08_30_tarama; gorev_08_30_tarama(); print('TARAMA_OK')" 2>&1 | Select-Object -Last 5 | Out-String
          }
          if (Test-Path data\gunluk_bomba.json) {
            $j = Get-Content data\gunluk_bomba.json -Raw | ConvertFrom-Json
            Write-Output ('Tarih: ' + $j.tarih + ' | Aday sayisi: ' + $j.bombalar.Count)
            $j.bombalar | Select-Object -First 15 | ForEach-Object { '  ' + $_.ticker + '  skor ' + $_.bomba_skor }
          } else { Write-Output 'gunluk_bomba.json YOK (tarama uretemedi!)' }
          Write-Output ''

          Write-Output '### 2) Config dogrulama (esik + kara liste)'
          & $py -X utf8 -c "import sys; sys.path.insert(0,r'C:\ANKA'); from otonom_trader import MIN_BOMBA_SKOR_ALIS, KARA_LISTE; esik=MIN_BOMBA_SKOR_ALIS; kl=sorted(KARA_LISTE); print('ESIK (MIN_BOMBA_SKOR_ALIS):', esik, '->', 'OK (15)' if esik==15 else 'BEKLENEN 15 DEGIL!'); print('KARA_LISTE (' + str(len(kl)) + '):', ', '.join(kl)); print('KARA_LISTE durumu:', 'AKTIF' if kl else 'BOS!')" 2>&1 | Out-String
          Write-Output ''

          Write-Output '### 3) 09:05 Alim ani (bugun emir verildi mi)'
          if (Test-Path data\otonom_trades.json) {
            $t = Get-Content data\otonom_trades.json -Raw | ConvertFrom-Json
            $bugunEmir = $t | Where-Object { $_.zaman -like ($bugun + '*') }
            if ($bugunEmir) {
              Write-Output ('Bugun ' + ($bugunEmir | Measure-Object).Count + ' emir:')
              $bugunEmir | ForEach-Object { '  ' + $_.zaman + ' ' + $_.tip + ' ' + $_.symbol + ' x' + $_.adet + ' @' + $_.fiyat + ' Skor:' + $_.skor + ' [' + $_.status + ']' }
            } else { Write-Output 'Bugun EMIR YOK (esik 15 ustu kara-liste-disi aday cikmadi veya piyasa kapali)' }
          } else { Write-Output 'otonom_trades.json YOK (hic emir verilmemis)' }
          Write-Output ''

          Write-Output '### 4) Bot durumu + son log'
          $ot = Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.CommandLine -like '*otonom_trader*' }
          if ($ot) { $m = if ($ot.CommandLine -match '--dry-run|--paper'){'PAPER'}else{'CANLI'}; Write-Output ('BIST bot: CALISIYOR (PID ' + $ot.ProcessId + ') MOD: ' + $m) } else { Write-Output 'BIST bot: CALISMIYOR' }
          if (Test-Path data\otonom_log.json) { (Get-Content data\otonom_log.json -Raw | ConvertFrom-Json) | Select-Object -Last 6 | ForEach-Object { '[' + $_.zaman + '] ' + $_.mesaj } }
          PSEOF
          ENC=$(printf '%s' "$PS" | iconv -t UTF-16LE | base64 -w0)
          mkdir -p data
          {
            echo "## 🌅 Sabah İzleme (09:10 TR, EMIRSIZ)"
            echo ""
            echo "_$(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M:%S TR') · run ${GITHUB_RUN_ID}_"
            echo ""
            echo '```'
            sshpass -p "$VPS_PASSWORD" ssh -o ConnectTimeout=25 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null \
              "$VUSER@$HOST" "powershell -NoProfile -EncodedCommand $ENC" 2>&1 || echo "SSH HATA — VPS/parola kontrol"
            echo '```'
          } > data/sabah_izleme.md
      - name: commit
        run: |
          git config user.name "anka-sabah-bot"; git config user.email "actions@github.com"
          git pull --rebase --autostash 2>&1 | tail -2 || true
          git add data/sabah_izleme.md
          git diff --staged --quiet || { git commit -m "🌅 Sabah izleme ($(TZ=Europe/Istanbul date '+%H:%M TR'))"; git push; }
